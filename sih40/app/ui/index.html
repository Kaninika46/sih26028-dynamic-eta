<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RUNTIME — Live Train Arrival Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#080D12; --surface:#0E161D; --surface-2:#141F28; --surface-3:#1B2A35;
  --line:#1E2E3A; --line-soft:#182530;
  --text:#EAF2F7; --text-2:#93A9B8; --text-3:#5D7183;
  --green:#2ED9A3; --green-bg:#0E3A30; --amber:#F5B544; --amber-bg:#3D2E10;
  --red:#F2635A; --red-bg:#3D1B18; --blue:#5AA9F2;
  --radius:14px; --radius-sm:10px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
  --theme-t:background-color .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease);
  --ease:cubic-bezier(.16,.84,.36,1);
}
body.light{
  --bg:#F7F5F1; --surface:#FFFFFF; --surface-2:#F2EFE9; --surface-3:#E8E3DA;
  --line:#E4DED3; --line-soft:#EFEAE1;
  --text:#1C1714; --text-2:#6B6055; --text-3:#9C9082;
  --green:#129C78; --green-bg:#DCF3EC; --amber:#B87914; --amber-bg:#F9EBD2;
  --red:#C94A40; --red-bg:#FBE3E0; --blue:#2E7CC4;
  --shadow:0 4px 24px rgba(0,0,0,.07);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased; min-height:100vh;
  transition:background .35s var(--ease), color .35s var(--ease);
}
h1,h2,h3,.font-display{font-family:'Sora',sans-serif;letter-spacing:-.02em;}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;}
input,select,textarea{font:inherit;color:inherit;}
::selection{background:var(--green-bg);color:var(--green);}
.hidden{display:none !important;}
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.8);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes sleeperScroll{from{background-position:0 0}to{background-position:28px 0}}
@keyframes smoothTrainPass{
  0%{transform:translateX(-140px);}
  100%{transform:translateX(calc(100% + 140px));}
}
@keyframes wheelSpin{
  100%{transform:rotate(360deg);}
}
@keyframes steamPuff{
  0%{opacity:0.8;transform:scale(0.6) translate(0, 0);}
  100%{opacity:0;transform:scale(1.8) translate(-14px, -12px);}
}
.anim-in{animation:fadeUp .5s var(--ease) backwards;}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ============ SHARED ============ */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:99px;letter-spacing:.01em;white-space:nowrap;flex-shrink:0;}
.pill.green{background:var(--green-bg);color:var(--green);}
.pill.amber{background:var(--amber-bg);color:var(--amber);}
.pill.red{background:var(--red-bg);color:var(--red);}
.pill .dot{width:5px;height:5px;border-radius:50%;background:currentColor;}
.live-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
  letter-spacing:.09em;color:var(--green);background:var(--green-bg);padding:3px 9px;border-radius:99px;}
.live-pill .dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.11em;color:var(--text-3);text-transform:uppercase;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.topbar,.pane,.tick,.titem,.hero,.panel,.kpi,.snap,.login,.role,
.tl-wrap,.map,.search,.tabs,.icon-btn{transition:var(--theme-t);}

/* Search field */
.search{display:flex;align-items:center;gap:9px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:0 12px;height:40px;
  transition:border-color .18s,box-shadow .18s;}
.search:focus-within{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 16%,transparent);}
.search svg{width:15px;height:15px;flex-shrink:0;stroke:var(--text-3);fill:none;stroke-width:2;}
.search input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:13.5px;height:100%;}
.search input::placeholder{color:var(--text-3);}
.search .clear{color:var(--text-3);font-size:16px;line-height:1;padding:2px 4px;border-radius:5px;flex-shrink:0;}
.search .clear:hover{color:var(--text);background:var(--surface-3);}

/* ============ LANDING ============ */
.landing{min-height:100vh;display:grid;place-items:center;padding:48px 24px;position:relative;overflow:hidden;}
.landing::before{content:"";position:absolute;inset:-20%;pointer-events:none;opacity:.55;
  background-image:radial-gradient(circle at 1px 1px,rgba(147,169,184,.13) 1px,transparent 0);
  background-size:32px 32px;
  mask-image:radial-gradient(ellipse 65% 55% at 50% 45%,#000 30%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse 65% 55% at 50% 45%,#000 30%,transparent 78%);}
.landing-inner{position:relative;z-index:1;max-width:1000px;width:100%;text-align:center;}
.logo{display:inline-flex;align-items:center;gap:11px;margin-bottom:26px;}
.logo-mark{width:38px;height:38px;border-radius:11px;position:relative;
  background:linear-gradient(140deg,var(--green),var(--blue));display:grid;place-items:center;}
.logo-mark::after{content:"";position:absolute;inset:5px;background:var(--bg);border-radius:7px;}
.logo-mark .core{position:relative;z-index:1;width:8px;height:8px;border-radius:50%;
  background:var(--green);box-shadow:0 0 12px var(--green);}
.logo-text{font-family:'Sora',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.01em;}
.landing h1{font-size:clamp(30px,4.6vw,46px);font-weight:700;line-height:1.12;margin-bottom:14px;}
.landing h1 .grad{background:linear-gradient(115deg,var(--green),var(--blue));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.landing .sub{font-size:15.5px;color:var(--text-2);max-width:560px;margin:0 auto 44px;}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;text-align:left;}
@media(max-width:840px){.roles{grid-template-columns:1fr;max-width:400px;margin:0 auto;}}
.role{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:24px 22px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .28s var(--ease),border-color .28s,box-shadow .28s;
  animation:scaleIn .5s var(--ease) backwards;}
.role:nth-child(1){animation-delay:.05s}.role:nth-child(2){animation-delay:.13s}.role:nth-child(3){animation-delay:.21s}
.role::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .28s;
  background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),var(--glow),transparent 62%);}
.role:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:var(--shadow);}
.role:hover::after{opacity:.1;}
.role>*{position:relative;z-index:1;}
.role .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;margin-bottom:15px;
  background:var(--accent-bg);color:var(--accent);}
.role .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.role h3{font-size:16px;font-weight:600;margin-bottom:6px;}
.role p{font-size:12.8px;color:var(--text-2);line-height:1.55;}
.role .go{margin-top:15px;font-size:12px;font-weight:600;color:var(--accent);
  display:flex;align-items:center;gap:5px;transition:gap .25s;white-space:nowrap;}
.role .go svg{width:14px;height:14px;flex-shrink:0;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.role:hover .go{gap:10px;}
.role.ctrl{--accent:var(--red);--accent-bg:var(--red-bg);--glow:var(--red);}
.role.stn{--accent:var(--amber);--accent-bg:var(--amber-bg);--glow:var(--amber);}
.role.pax{--accent:var(--green);--accent-bg:var(--green-bg);--glow:var(--green);}

/* ============ LOGIN ============ */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:28px;}
.login{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);
  border-radius:20px;padding:32px;position:relative;box-shadow:var(--shadow);
  animation:scaleIn .45s var(--ease);}
.login .top-bar{height:3px;border-radius:99px;background:var(--accent);width:44px;margin-bottom:22px;}
.back{position:absolute;top:16px;right:18px;font-size:12px;color:var(--text-3);padding:4px 9px;border-radius:7px;transition:.18s;}
.back:hover{color:var(--text);background:var(--surface-2);}
.login .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-bg);color:var(--accent);margin-bottom:16px;}
.login .ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.login h2{font-size:20px;font-weight:600;margin-bottom:5px;}
.login .sub{font-size:13px;color:var(--text-2);margin-bottom:24px;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;font-size:13.5px;outline:none;transition:border-color .18s,box-shadow .18s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent);}
.field textarea{resize:vertical;min-height:66px;font-family:inherit;}
.btn{width:100%;padding:11px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;background:var(--accent);color:var(--btn-fg,#06231C);margin-top:6px;transition:filter .18s,transform .1s;}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(.985);}
.login .note{font-size:11.5px;color:var(--text-3);text-align:center;margin-top:16px;}
.login .alt{display:block;width:100%;text-align:center;font-size:12.5px;color:var(--text-2);margin-top:13px;padding:6px;}
.login .alt:hover{color:var(--text);}
.login.ctrl{--accent:var(--red);--accent-bg:var(--red-bg);--btn-fg:#2A0D0B;}
.login.stn{--accent:var(--amber);--accent-bg:var(--amber-bg);--btn-fg:#291D06;}
.login.pax{--accent:var(--green);--accent-bg:var(--green-bg);--btn-fg:#04241B;}
.otp{font-size:12px;color:var(--green);margin-top:-6px;margin-bottom:12px;display:none;align-items:center;gap:5px;}
.otp.show{display:flex;animation:fadeUp .3s var(--ease);}

/* ============ APP CHROME ============ */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 22px;height:60px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:40;}
.topbar .brand{display:flex;align-items:center;gap:10px;min-width:0;}
.topbar .logo-mark{width:31px;height:31px;border-radius:9px;}
.topbar .logo-mark::after{inset:4px;border-radius:5px;background:var(--surface);}
.topbar .bt{font-family:'Sora',sans-serif;font-size:15px;font-weight:700;line-height:1.1;}
.topbar .bs{font-size:10.5px;color:var(--text-3);}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;}
.tab{padding:7px 15px;border-radius:8px;font-size:12.8px;font-weight:500;color:var(--text-2);white-space:nowrap;transition:background .2s,color .2s;}
.tab:hover{color:var(--text);}
.tab.on{background:var(--surface-3);color:var(--text);font-weight:600;}
.topbar .right{display:flex;align-items:center;gap:14px;}
.clock{text-align:right;line-height:1.15;}
.clock .t{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;}
.clock .z{font-size:10px;color:var(--text-3);}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);transition:.18s;}
.icon-btn:hover{color:var(--text);border-color:var(--surface-3);}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* Ticker */
.ticker{display:flex;gap:0;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--line);padding:0 6px;scrollbar-width:none;}
.ticker::-webkit-scrollbar{display:none;}
.tick{display:flex;align-items:center;gap:13px;padding:11px 17px;cursor:pointer;border-right:1px solid var(--line-soft);white-space:nowrap;transition:background .18s;}
.tick:hover{background:var(--surface);}
.tick.on{background:var(--surface-2);}
.tick .no{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text-3);}
.tick .nm{font-size:12.8px;font-weight:500;max-width:170px;overflow:hidden;text-overflow:ellipsis;}
.tick .et{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;}
.tick .bd{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-3);}
.tick .st{width:7px;height:7px;border-radius:50%;}

/* ============ CONTROL LAYOUT ============ */
.grid3{display:grid;grid-template-columns:minmax(230px,268px) minmax(0,1fr) minmax(290px,326px);gap:1px;background:var(--line);flex:1;min-height:0;overflow:hidden;}
body.shell{overflow:hidden;height:100vh;}
body.shell #app{display:flex;flex-direction:column;height:100vh;}
body.shell .topbar,body.shell .ticker{flex-shrink:0;}
body.shell .scrollarea{flex:1;min-height:0;overflow-y:auto;}
@media(max-width:1180px){
  body.shell{overflow:auto;height:auto;}
  body.shell #app{height:auto;display:block;}
  .grid3{overflow:visible;grid-template-columns:1fr;}
}
.pane{background:var(--bg);min-width:0;display:flex;flex-direction:column;min-height:0;}
.pane-scroll{max-height:calc(100vh - 60px - 45px);overflow-y:auto;}
@media(max-width:1180px){.pane-scroll{max-height:none;}}
.pane-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px 11px;}
.pane-hd .ct{font-size:11px;color:var(--text-3);}

.tlist{display:flex;flex-direction:column;}
.titem{display:flex;flex-direction:column;gap:5px;padding:12px 16px;cursor:pointer;border-top:1px solid var(--line-soft);border-left:3px solid transparent;transition:background .18s,border-color .18s;}
.titem:hover{background:var(--surface);}
.titem.on{background:var(--surface-2);border-left-color:var(--green);}
.titem .r1{display:flex;align-items:center;justify-content:space-between;gap:9px;}
.titem .nm{font-size:13.3px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.titem .r2{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-3);}
.titem .r2 .rt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.empty{padding:26px 16px;text-align:center;font-size:12.5px;color:var(--text-3);}

.detail{padding:20px 22px 44px;min-width:0;}
.dhd{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.dhd h2{font-size:21px;font-weight:600;line-height:1.25;}
.dhd h2 .num{color:var(--text-3);font-weight:500;font-family:'JetBrains Mono',monospace;font-size:15px;}
.dhd .rt{font-size:12.8px;color:var(--text-2);margin-top:3px;}

.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:22px;margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
@media(max-width:640px){.hero{grid-template-columns:1fr;}}
.hero .lbl{font-size:10.5px;font-weight:700;letter-spacing:.11em;color:var(--text-3);text-transform:uppercase;margin-bottom:7px;}
.hero .big{font-family:'JetBrains Mono',monospace;font-size:42px;font-weight:700;line-height:1;letter-spacing:-.02em;animation:fadeUp .4s var(--ease);}
.hero .meta{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--text-2);margin-top:9px;}
.gauge{text-align:right;}
.gauge .cap{font-size:10.5px;color:var(--text-3);margin-bottom:6px;}

.wx{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);position:relative;overflow:hidden;}
.wx .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;font-size:19px;z-index:2;}
.wx .nm{font-size:14.5px;font-weight:600;}
.wx .dt{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text-2);margin-top:1px;}
.wx .tag{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--text-3);text-transform:uppercase;z-index:2;}

.sec-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 11px;}
.prog{padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
.prog-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
.prog-pct{font-size:15px;font-weight:700;}
.prog-track{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
.prog-fill{height:100%;border-radius:99px;transition:width .8s var(--ease);}
.prog-ends{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-size:11px;color:var(--text-3);}
.prog-ends span{max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prog-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;padding-top:15px;border-top:1px solid var(--line-soft);}
.prog-stats .v{font-size:16px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prog-stats .l{font-size:10.5px;color:var(--text-3);margin-top:3px;}
.tl-wrap{padding:4px 16px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
.detail-foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-3);}
.detail-foot .src{display:flex;align-items:center;gap:7px;}
.detail-foot .src b{color:var(--text-2);font-weight:600;}

.map{height:290px;position:relative;background:var(--surface-2);}
.map-dark-tiles{filter:invert(1) hue-rotate(180deg) brightness(.8) contrast(.9) saturate(.5);}
.map-msg{height:100%;display:grid;place-items:center;text-align:center;padding:20px;color:var(--text-3);font-size:12.5px;gap:6px;}
.legend{position:absolute;bottom:9px;left:9px;z-index:500;display:flex;gap:11px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:10.5px;backdrop-filter:blur(6px);}
.legend span{display:flex;align-items:center;gap:4px;}
.legend i{width:7px;height:7px;border-radius:50%;}
.tmark{position:relative;width:15px;height:15px;}
.tmark .d{position:absolute;inset:0;border-radius:50%;border:2.5px solid #fff;z-index:2;box-shadow:0 1px 6px rgba(0,0,0,.5);}
.tmark .r{position:absolute;top:-4px;left:-4px;width:23px;height:23px;border-radius:50%;border:2px solid currentColor;animation:ring 2.2s var(--ease) infinite;}
.route-flow{animation:dash 1.1s linear infinite;}
.leaflet-popup-content-wrapper{background:var(--surface);color:var(--text);border-radius:10px;font-family:'Inter',sans-serif;font-size:12.5px;box-shadow:var(--shadow);}
.leaflet-popup-tip{background:var(--surface);}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 85%,transparent) !important;color:var(--text-3) !important;font-size:9.5px !important;}

.toast{position:fixed;bottom:22px;right:22px;z-index:999;max-width:330px;display:flex;align-items:center;gap:10px;padding:13px 17px;background:var(--surface-2);border:1px solid var(--green);border-radius:12px;font-size:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .28s var(--ease),transform .28s var(--ease);}

<body>
<div id="app"></div>
<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg"></span></div>
<script>
/* ================= ICONS ================= */
const I = {
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>',
  ctrl:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  stn:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>',
  pax:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M13 6v12" stroke-dasharray="2 2"/>',
  out:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>',
  arrow:'<path d="M5 12h14M12 5l7 7-7 7"/>',
  moon:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
};
const svg = (p,c='') => `<svg viewBox="0 0 24 24" class="${c}">${p}</svg>`;

/* ================= STATE ================= */
const DEMO = [
  {id:"12951",name:"Mumbai Rajdhani",from:"New Delhi",to:"Mumbai Central",
   stations:["New Delhi","Kota Jn","Vadodara Jn","Surat","Borivali","Mumbai Central"],stopIdx:2,
   predMin:18,confLo:12,confHi:26,status:"amber",weather:"cloudy",tempC:29,visibilityKm:8,
   breakdown:[["Section congestion",7],["Speed restriction",5],["Historical pattern",4],["Weather",2]],override:null},
  {id:"12301",name:"Howrah Rajdhani",from:"New Delhi",to:"Howrah Jn",
   stations:["New Delhi","Kanpur Ctrl","Mughalsarai","Gaya","Dhanbad","Howrah Jn"],stopIdx:1,
   predMin:4,confLo:0,confHi:9,status:"green",weather:"clear",tempC:31,visibilityKm:10,
   breakdown:[["Section congestion",2],["Historical pattern",2]],override:null},
  {id:"12002",name:"Bhopal Shatabdi",from:"New Delhi",to:"Bhopal Jn",
   stations:["New Delhi","Agra Cantt","Gwalior","Jhansi Jn","Bhopal Jn"],stopIdx:0,
   predMin:52,confLo:41,confHi:63,status:"red",weather:"fog",tempC:17,visibilityKm:0.6,
   breakdown:[["Block closure",30],["Historical pattern",9],["Weather",7],["Section congestion",6]],override:null},
];
const FALLBACK_COORDS = {
  "New Delhi":[28.6435,77.2197],"Kota Jn":[25.1804,75.8648],"Vadodara Jn":[22.3072,73.1812],
  "Surat":[21.1702,72.8311],"Borivali":[19.2288,72.8567],"Mumbai Central":[18.9695,72.8193],
  "Kanpur Ctrl":[26.4499,80.3319],"Mughalsarai":[25.2801,83.1101],"Gaya":[24.7955,84.9994],
  "Dhanbad":[23.7957,86.4304],"Howrah Jn":[22.5851,88.3468],"Agra Cantt":[27.1591,77.9709],
  "Gwalior":[26.2183,78.1828],"Jhansi Jn":[25.4484,78.5685],"Bhopal Jn":[23.2599,77.4126],
};
const S = {
  screen:'landing', role:null, tab:'control',
  trains: DEMO.map(t=>({...t, progress:.3+Math.random()*.3})),
  coords: {...FALLBACK_COORDS},
  selId: DEMO[0].id, paxId: DEMO[0].id,
  ctrlQuery:'', paxQuery:'', audit:[], live:false, stationName:'New Delhi',
  theme:'auto',
};
const maps = {};
const $ = id => document.getElementById(id);
const app = () => $('app');

/* ================= HELPERS ================= */
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const clockAt = m => { const d=new Date(Date.now()+m*60000); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const statusOf = t => t.status || (t.predMin<10?'green':t.predMin<25?'amber':'red');
const statusLabel = s => s==='green'?'On time':s==='amber'?'Minor delay':'Major delay';
const statusHex = s => s==='green'?'#2ED9A3':s==='amber'?'#F5B544':'#F2635A';
const filterTrains = q => { q=(q||'').trim().toLowerCase(); return !q ? S.trains
  : S.trains.filter(t=>t.id.toLowerCase().includes(q)||String(t.name).toLowerCase().includes(q)); };
const sel = () => S.trains.find(t=>t.id===S.selId) || S.trains[0];
const paxSel = () => S.trains.find(t=>t.id===S.paxId) || S.trains[0];

const WX = {
  clear:{i:'☀️',n:'Clear weather',bg:'var(--amber-bg)',c:'var(--amber)'},
  cloudy:{i:'⛅',n:'Cloudy skies',bg:'var(--surface-2)',c:'var(--text-2)'},
  rain:{i:'🌧️',n:'Rain on route',bg:'var(--surface-2)',c:'var(--blue)'},
  heavy_rain:{i:'⛈️',n:'Heavy rain',bg:'var(--red-bg)',c:'var(--red)'},
  fog:{i:'🌫️',n:'Fog advisory',bg:'var(--amber-bg)',c:'var(--amber)'},
  dense_fog:{i:'🌫️',n:'Dense fog',bg:'var(--red-bg)',c:'var(--red)'},
};

/* point at fraction f along a polyline [[lat,lon],...] (used for real OSM track paths) */
function alongPath(path, f){
  if(!path||path.length<2) return null;
  const d=[0]; for(let i=1;i<path.length;i++){ const a=path[i-1],b=path[i];
    d.push(d[i-1]+Math.hypot(b[0]-a[0],(b[1]-a[1])*Math.cos(a[0]*Math.PI/180))); }
  const target=d[d.length-1]*Math.max(0,Math.min(1,f));
  for(let i=1;i<path.length;i++) if(d[i]>=target){ const s=(target-d[i-1])/((d[i]-d[i-1])||1);
    return [path[i-1][0]+(path[i][0]-path[i-1][0])*s, path[i-1][1]+(path[i][1]-path[i-1][1])*s]; }
  return path[path.length-1];
}
function stopEta(t, i){
  const last = t.stations.length - 1;
  const from = t.stopIdx;
  if (i <= from) return null;
  if (last <= from) return t.predMin;
  return t.predMin * ((i - from) / (last - from));
}
function gauge(t){
  const w=180,h=42,r=Math.max(t.confHi,1);
  const x1=10+(t.confLo/r)*(w-20), x2=10+(t.confHi/r)*(w-20), xm=10+(t.predMin/r)*(w-20);
  const c=statusHex(statusOf(t));
  return `<div class="gauge"><div class="cap">±${Math.round((t.confHi-t.confLo)/2)} min band</div>
    <svg width="${w}" height="${h}"><line x1="10" y1="${h/2}" x2="${w-10}" y2="${h/2}" stroke="var(--surface-3)" stroke-width="2" stroke-linecap="round"/>
    <line x1="${x1}" y1="${h/2}" x2="${x2}" y2="${h/2}" stroke="${c}" stroke-width="6" stroke-linecap="round" opacity=".45"/>
    <circle cx="${xm}" cy="${h/2}" r="5.5" fill="${c}"/></svg></div>`;
}
function searchBox(id, val, ph, handler){
  return `<div class="search">${svg(I.search)}
    <input id="${id}" type="text" placeholder="${ph}" value="${esc(val)}" oninput="${handler}(this.value)" autocomplete="off">
    ${val?`<button class="clear" onclick="${handler}('');document.getElementById('${id}').value='';">×</button>`:''}</div>`;
}

/* ================= THEME ================= */
function isLight(){
  if(S.theme==='light') return true;
  if(S.theme==='dark') return false;
  return S.tab==='passenger';
}
function toggleTheme(){
  S.theme = isLight() ? 'dark' : 'light';
  render();
}

/* ================= TOAST ================= */
let toastT;
function toast(msg){
  $('toastMsg').textContent = msg;
  $('toast').classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(()=>$('toast').classList.remove('on'), 3600);
}

/* ================= MAP ================= */
function drawMap(id, list, opt={}){
  const el = $(id); if(!el) return;
  if(maps[id]){ maps[id].remove(); delete maps[id]; }
  if(typeof L === 'undefined'){
    el.innerHTML = `<div class="map-msg"><div style="font-size:22px">🗺️</div>
      <div>Map library couldn't load — check your connection.</div>
      <div style="font-size:11px;color:var(--text-3)">All ETA predictions still work.</div></div>`;
    return;
  }
  el.innerHTML = '';
  const light = !!opt.light;
  const map = L.map(id,{zoomControl:opt.zoom!==false, attributionControl:true, scrollWheelZoom:false});
  map.attributionControl.setPrefix(false);
  const layer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'});
  if(!light) layer.on('add',()=>{ const c=layer.getContainer(); if(c) c.classList.add('map-dark-tiles'); });
  layer.addTo(map);

  const bounds=[];
  list.forEach(t=>{
    const pts = (t.path&&t.path.length>1) ? t.path : t.stations.map(s=>S.coords[s]).filter(Boolean);
    const c = statusHex(statusOf(t));
    if(opt.route!==false && pts.length>1){
      L.polyline(pts,{color:c,weight:4,opacity:.25}).addTo(map);
      L.polyline(pts,{color:c,weight:2.5,opacity:.9,dashArray:'1,10',className:'route-flow'}).addTo(map);
    }
    t.stations.forEach((nm,i)=>{
      const p = S.coords[nm]; if(!p) return;
      bounds.push(p);
      const past=i<t.stopIdx, now=i===t.stopIdx;
      L.circleMarker(p,{radius:now?5:3.5,weight:1.5,
        color:past?'#129C78':(now?c:'#5D7183'),
        fillColor:past?'#2ED9A3':(now?c:(light?'#C9BFA4':'#3A4B58')),fillOpacity:.95})
        .addTo(map).bindPopup(`<b>${esc(nm)}</b><br/>${esc(t.name)}`);
    });
    const cur=S.coords[t.stations[t.stopIdx]], nxt=S.coords[t.stations[t.stopIdx+1]];
    let pos=cur;
    if(t.segPath&&t.segPath.length>1) pos=alongPath(t.segPath, t.progress||.4);
    else if(cur&&nxt){ const f=t.progress||.4; pos=[cur[0]+(nxt[0]-cur[0])*f, cur[1]+(nxt[1]-cur[1])*f]; }
    if(pos){
      const ic = L.divIcon({className:'',iconSize:[15,15],iconAnchor:[7.5,7.5],
        html:`<div class="tmark" style="color:${c}"><div class="r"></div><div class="d" style="background:${c}"></div></div>`});
      t._mk = L.marker(pos,{icon:ic,riseOnHover:true}).addTo(map)
        .bindPopup(`<b>${esc(t.name)}</b> #${esc(t.id)}<br/>ETA ${clockAt(t.predMin)}`);
      t._cur=cur; t._nxt=nxt; bounds.push(pos);
    }
  });
  if(!bounds.length) map.setView([26.29,73.03],7);
  else if(bounds.length===1) map.setView(bounds[0],9);
  else map.fitBounds(bounds,{padding:[42,42],maxZoom:10});
  setTimeout(()=>map.invalidateSize(),60);
  maps[id]=map;
}
setInterval(()=>{
  const t=Date.now()/6000;
  S.trains.forEach((tr,i)=>{
    if(!tr._mk||!tr._cur||!tr._nxt) return;
    const f=Math.max(.08,Math.min(.92,(tr.progress||.4)+Math.sin(t+i)*.02));
    const p=(tr.segPath&&tr.segPath.length>1)?alongPath(tr.segPath,f)
      :[tr._cur[0]+(tr._nxt[0]-tr._cur[0])*f, tr._cur[1]+(tr._nxt[1]-tr._cur[1])*f];
    if(p) tr._mk.setLatLng(p);
  });
},1800);

async function injectOverride(){
  const t=sel(); if(!t) return;
  if(!canDo('override')){ toast('Only control room staff can inject overrides'); return; }
  const role=$('ovRole').value, type=$('ovType').value, loc=$('ovLoc').value,
        sev=$('ovSev').value, note=$('ovNote').value||'No additional notes provided.';
  if(S.live){
    const r=await api('/api/override',{method:'POST', body:{train_no:t.id, type, location:loc, severity:sev, note}});
    if(!r.ok){ const e=await r.json().catch(()=>({})); toast(e.error||('Override refused ('+r.status+')')); return; }
    toast(`Override saved for ${t.name} - ETA recomputed`);
    await loadLive(); if(canDo('audit')) await loadAudit(); render(); return;
  }
  const bump = sev.includes('Critical')?45 : sev.includes('High')?30 : sev.includes('Moderate')?18 : 8;
  const n=new Date(), time=pad(n.getHours())+':'+pad(n.getMinutes());
  t.override={by:`${role} · session ${Math.floor(Math.random()*9000+1000)}`,type,loc,sev,time,note};
  t.predMin=+(t.predMin+bump).toFixed(1);
  t.confLo=+(t.confLo+bump*.7).toFixed(1); t.confHi=+(t.confHi+bump*1.3).toFixed(1);
  t.breakdown.unshift([type+' (override)',bump]);
  t.status = sev.includes('Low')?'amber':'red';
  S.audit.unshift({train:t.name,id:t.id,type,loc,time,by:role});
  toast(`ETA for ${t.name} recomputed — downstream stations updated`);
  render();
}

        </div>

          ${t.stations.map((s,i)=>{
            const isPast = i < t.stopIdx;
            const isNow = i === t.stopIdx;
            const cls = isPast ? 'past' : (isNow ? 'now' : '');
            const etaText = isPast ? 'passed' : (isNow ? 'here' : clockAt(stopEta(t,i)));
            return `<div class="pax-timeline-row ${cls}">
              <div class="dot-wrapper"><div class="dt"></div></div>
              <span class="nm">${esc(s)}</span>

}

/* ================= ANALYTICS ================= */
function viewAnalytics(){
  const c={green:0,amber:0,red:0};
  S.trains.forEach(t=>c[statusOf(t)]++);
  const total=S.trains.length||1;
  const avg=Math.round(S.trains.reduce((s,t)=>s+t.predMin,0)/total);
  const causes={};
  S.trains.forEach(t=>t.breakdown.forEach(([l,v])=>{const k=l.replace(/\s*\(override\)/i,'');causes[k]=(causes[k]||0)+v;}));
  const top=Object.entries(causes).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const mxC=Math.max(...top.map(x=>x[1]),1);
  const byT=[...S.trains].sort((a,b)=>b.predMin-a.predMin);
  const mxT=Math.max(...S.trains.map(t=>t.predMin),1);
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Today'], vals=[14,19,11,26,21,9,avg];
  const w=320,h=118,p=18,mv=Math.max(...vals)*1.2;
  const sx=(w-p*2)/(vals.length-1);
  const pts=vals.map((v,i)=>[p+i*sx, h-p-8-(v/mv)*(h-p*2)]);
  const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
  return `<div class="an-wrap">
    <div class="an-top"><div><h2>Delay analytics</h2>
      <div class="sub">Network-wide punctuality, trends and root-cause breakdown</div></div>
      <span class="live-pill"><span class="dot"></span>LIVE</span></div>
    <div class="kpis">
      ${[[c.green,'On time','var(--green)'],[c.amber,'Minor delay','var(--amber)'],
         [c.red,'Major delay','var(--red)'],[avg+'m','Average delay','var(--text)']]
        .map(([v,l,col])=>`<div class="kpi"><div class="v" style="color:${col}">${v}</div><div class="l">${l}</div></div>`).join('')}
    </div>
    <div class="an-2">
      <div class="panel"><h3>On-time performance — ${S.trains.length} trains tracked</h3>
        ${[['green','On time'],['amber','Minor delay (&lt; 25 min)'],['red','Major delay (25+ min)']].map(([k,l])=>{
          const pc=Math.round(c[k]/total*100);
          return `<div class="bar-row"><div class="bl">${l}</div>
            <div class="bar-track"><div class="bar-fill" data-w="${pc}" style="width:0%;background:${statusHex(k)}"></div></div>
            <div class="bar-val">${c[k]} · ${pc}%</div></div>`;}).join('')}</div>
      <div class="panel"><h3>7-day average network delay (minutes)</h3>
        <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
          <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--green)" stop-opacity=".3"/>
            <stop offset="100%" stop-color="var(--green)" stop-opacity="0"/></linearGradient></defs>
          <path d="${line} L${pts[pts.length-1][0].toFixed(1)},${h-p} L${pts[0][0].toFixed(1)},${h-p} Z" fill="url(#g1)"/>
          <path d="${line}" fill="none" stroke="var(--green)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          ${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.2" fill="var(--surface)" stroke="var(--green)" stroke-width="2"><title>${days[i]}: ${vals[i]} min</title></circle>`).join('')}
          ${days.map((d,i)=>`<text x="${pts[i][0]}" y="${h-4}" font-size="9" fill="var(--text-3)" text-anchor="middle" font-family="JetBrains Mono">${d}</text>`).join('')}
        </svg></div>
    </div>
    <div class="panel" style="margin-bottom:16px"><h3>Predicted delay by train</h3>
      ${byT.map(t=>`<div class="bar-row"><div class="bl">${esc(t.name)}</div>
        <div class="bar-track"><div class="bar-fill" data-w="${(t.predMin/mxT*100).toFixed(0)}" style="width:0%;background:${statusHex(statusOf(t))}"></div></div>
        <div class="bar-val">${Math.round(t.predMin)}m</div></div>`).join('')}</div>
    <div class="panel"><h3>Leading delay causes across the network</h3>
      ${top.map(([l,v])=>`<div class="bar-row"><div class="bl">${esc(l)}</div>
        <div class="bar-track"><div class="bar-fill" data-w="${(v/mxC*100).toFixed(0)}" style="width:0%;background:var(--amber)"></div></div>
        <div class="bar-val">${Math.round(v)}m</div></div>`).join('')}</div>
  </div>`;
}

/* ================= ROUTER ================= */
function go(screen, role){
  if(screen==='login' && AUTH.on && AUTH.user && PORTAL[role] && PORTAL[role].includes(AUTH.user.role)){ S.role=role; enter(role); return; }
  document.body.classList.remove('shell'); S.screen=screen; S.role=role||S.role; render(); }
function enter(role){
  if(AUTH.on && role!=='pax' && !AUTH.user){ go('login', role); return; }
  if(role==='stn'){
    if(AUTH.on && AUTH.user && AUTH.user.station_code){ S.stationCode=AUTH.user.station_code; S.stationName=AUTH.user.station_code; }
    else { const p=$('stnPick'); if(p&&!/Auto-detect|Assigned/.test(p.value)) S.stationName=p.value.split(' — ')[1]||S.stationName; }
  }
  S.screen='app'; S.tab = role==='ctrl'?'control':role==='stn'?'station':'passenger';
  if(!allowedViews().includes(S.tab)) S.tab=allowedViews()[0];
  render();
}
function setTab(t){ if(!allowedViews().includes(t)){ toast('Your account cannot open this screen'); return; } S.tab=t; render(); }
function pick(id){ S.selId=id; render(); }
function pickPax(id){ S.paxId=id; render(); }
function setCtrlQuery(v){ S.ctrlQuery=v; renderPanel('ctrlS'); }
function setPaxQuery(v){ S.paxQuery=v; renderPanel('paxS'); }
function renderPanel(focusId){
  render();
  const el=$(focusId); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); }
}

function render(){
  const root=app();
  if(S.screen==='landing'){ root.innerHTML=viewLanding(); return; }
  if(S.screen==='login'){ root.innerHTML=viewLogin(S.role); return; }
  if(!allowedViews().includes(S.tab)) S.tab=allowedViews()[0];   // never render a forbidden screen

  document.body.classList.toggle('light', isLight());
  document.body.classList.toggle('shell', S.tab==='control');
  const inner = S.tab==='control'?viewControl()
              : S.tab==='station'?viewStation()
              : S.tab==='passenger'?viewPassenger()
              : viewAnalytics();
  root.innerHTML = S.tab==='control'
    ? chrome(inner)
    : chrome(`<div class="scrollarea"><div class="anim-in">${inner}</div></div>`);

  // maps
  const lightMap = isLight();
  if(S.tab==='control') setTimeout(()=>drawMap('mapCtrl',[sel()],{light:lightMap}),40);
  if(S.tab==='station') setTimeout(()=>drawMap('mapStn',S.trains,{light:lightMap,route:false}),40);
  if(S.tab==='passenger') setTimeout(()=>drawMap('mapPax',[paxSel()],{light:lightMap}),40);

  // animate bars
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    root.querySelectorAll('.bar-fill,.prog-fill').forEach(b=>{ b.style.width=(b.dataset.w||0)+'%'; });
  }));
}

setInterval(()=>{ const c=$('clk'); if(c){ const n=new Date();
  c.textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`; } },1000);

/* ================= AUTH (Supabase) ================= */
const AUTH = {on:false, sb:null, token:null, user:null};
const PORTAL = {ctrl:['controller','admin'], stn:['station','controller','admin'],
                pax:['passenger','station','controller','admin']};
function allowedViews(){ if(!AUTH.on) return ['control','station','passenger','analytics'];
  return AUTH.user ? AUTH.user.views : ['passenger']; }
function canDo(a){ return !AUTH.on || !!(AUTH.user && AUTH.user.actions.includes(a)); }
async function api(path, opts={}){
  const h={...(opts.headers||{})};
  if(AUTH.token) h['Authorization']='Bearer '+AUTH.token;
  if(opts.body && typeof opts.body!=='string'){ h['Content-Type']='application/json'; opts={...opts, body:JSON.stringify(opts.body)}; }
  return fetch(path,{...opts, headers:h});
}
async function initAuth(){
  try{
    const r=await fetch('/api/config'); if(!r.ok) return;
    const c=await r.json();
    if(!c.auth) return;
    if(!window.supabase){ console.log('Supabase library did not load - sign-in unavailable'); AUTH.on=true; return; }
    AUTH.on=true; AUTH.sb=window.supabase.createClient(c.supabaseUrl, c.supabaseKey);
    AUTH.sb.auth.onAuthStateChange((_e, session)=>{ AUTH.token = session ? session.access_token : null; });
    const {data}=await AUTH.sb.auth.getSession();
    if(data.session){ AUTH.token=data.session.access_token; await loadMe(); }
  }catch(e){ console.log('Auth config not available: '+e.message); }
}
async function loadMe(){
  const r=await api('/api/me'); AUTH.user = r.ok ? await r.json() : null; return AUTH.user;
}
function loginErr(msg){ const el=$('loginErr'); if(el){ el.textContent=msg; el.style.display='block'; } }
async function signIn(portal){
  if(!AUTH.on){ enter(portal); return; }
  if(!AUTH.sb){ loginErr('Sign-in service could not load - check your connection.'); return; }
  const email=($('loginEmail')||{}).value, pw=($('loginPw')||{}).value;
  if(!email||!pw){ loginErr('Enter your email and password.'); return; }
  const {data,error}=await AUTH.sb.auth.signInWithPassword({email, password:pw});
  if(error){ loginErr(error.message); return; }
  AUTH.token=data.session.access_token;
  const me=await loadMe();
  if(!me){ loginErr('Could not load your profile.'); return; }
  if(!PORTAL[portal].includes(me.role)){
    await AUTH.sb.auth.signOut(); AUTH.token=null; AUTH.user=null;
    loginErr(`This is a ${me.role} account - it cannot open this screen.`); return;
  }
  api('/api/log',{method:'POST', body:{action: portal==='stn'?'station_board_opened':'control_room_signin',
    detail:{station: me.station_code||null, email: me.email||null}}});
  enter(portal); await loadLive(); if(canDo('audit')) loadAudit();
}
async function signUp(){
  if(!AUTH.sb){ loginErr('Sign-in service could not load.'); return; }
  const email=($('loginEmail')||{}).value, pw=($('loginPw')||{}).value;
  if(!email||!pw||pw.length<6){ loginErr('Enter an email and a password of at least 6 characters.'); return; }
  const {data,error}=await AUTH.sb.auth.signUp({email, password:pw});
  if(error){ loginErr(error.message); return; }
  if(!data.session){ loginErr('Account created. Confirm the link in your email, then sign in.'); return; }
  AUTH.token=data.session.access_token; await loadMe(); enter('pax'); loadLive();
}
async function signOut(){
  if(AUTH.sb) await AUTH.sb.auth.signOut();
  AUTH.token=null; AUTH.user=null; S.audit=[]; go('landing');
}
async function loadAudit(){
  const r=await api('/api/audit'); if(!r.ok) return;
  const rows=await r.json();
  S.audit=rows.filter(a=>a.action==='override').map(a=>{
    const d=a.detail||{}, t=new Date(a.created_at), tr=S.trains.find(x=>x.id===String(a.train_no));
    return {train:tr?tr.name:('Train '+a.train_no), id:String(a.train_no), type:d.incident_type||a.action,
            loc:d.location||'', time:pad(t.getHours())+':'+pad(t.getMinutes()), by:a.role};
  });
  if(S.tab==='control') render();
}

/* ================= LIVE DATA ================= */
async function loadLive(){
  try{
    const r=await fetch('/api/coords');
    if(r.ok){ const d=await r.json(); if(d&&Object.keys(d).length){ Object.assign(S.coords,d);
      console.log(`Loaded ${Object.keys(d).length} station coordinates.`); } }
  }catch(e){}
  try{
    const r=await api('/api/trains');
    if(!r.ok){ console.log('Backend returned '+r.status+' — using demo data.'); return; }
    const d=await r.json();
    if(Array.isArray(d)&&d.length){
      S.trains = d.map(t=>{
        const keep=(t.stations||[]).filter(s=>S.coords[s]);
        const stations = keep.length>=2?keep:(t.stations||[]);
        return {...t, stations,
          stopIdx: Math.min(t.stopIdx||0, Math.max(0,stations.length-2)),
          breakdown: (t.breakdown||[]).filter(b=>Array.isArray(b)&&b.length===2),
          progress: (typeof t.progress==='number') ? t.progress : .3+Math.random()*.3};
      }).filter(t=>t.stations.length>=2);
      if(S.trains.length){
        if(!S.trains.some(t=>t.id===S.selId)) S.selId=S.trains[0].id;
        if(!S.trains.some(t=>t.id===S.paxId)) S.paxId=S.trains[0].id;
        S.live=true;
        S.stationName = S.trains[0].from || S.stationName;
        console.log(`Loaded ${S.trains.length} trains from backend (real model predictions).`);
        render();
      }
    }
  }catch(e){ console.log('Backend not reachable ('+e.message+') — using demo data.'); }
}

render();
async function boot(){ await initAuth(); await loadLive(); if(AUTH.user && canDo('audit')) loadAudit(); render(); }
if(document.readyState==='complete') boot(); else window.addEventListener('load', boot);
setInterval(()=>{ if(S.screen==='app') loadLive(); }, 60000);
</script>
